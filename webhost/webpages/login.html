<!DOCTYPE html>
<html>
<head>
    <title>AI research buddy login</title>
</head>
<body>
	<h1 class="title">Login to use the AI research buddy</h1>

	<div class="center">
		<div class="move-good">

		<form method="POST">
			<input type="text" name="username" placeholder="example@emailservice.com">
			<input type="password" name="password" placeholder="SuperSecurePa$$word!??!?!">
			<br>
			<button type="submit">LOGIN</button>
		</form>
		<br>
		{% if result == "failed" %}
			<h2 class="wrong">INCORRECT LOGIN!</h2>
		{% endif %}
		</div>
	</div>

	<style>
		body {
			background-color: #243119;
			color: #C9F2C7;
			padding: 8vw;
		}		

		.title {
			text-align: center;
		}

		.center {
			display: flex;
			justify-content: center;
			align-items: center;
			border: 3px solid #629460;
			border-radius: 3px;

			background-color: #96BE8C;
			color: #243119;

		}

		.wrong {
			color: red;
		}

		.move-good {
			text-align: center;
			padding: 2vw

		}
	</style>

</body>
</html>
